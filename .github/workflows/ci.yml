name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          VITE_POLLINATIONS_CLIENT_ID: pk_ci
          VITE_POLLINATIONS_BASE: http://localhost:4180
          VITE_POLLINATIONS_AUTHORIZE_BASE: http://localhost:4180
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build
          path: build/
